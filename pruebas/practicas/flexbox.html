<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica Felx formulario</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .flex-container{
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            background: rgb(213, 153, 228);
            margin: 50px auto;
            padding: 30px;
            border-radius: 25px;
            max-width: 700px;
                   
        }

        .form{
            min-width: 400px;
            flex: 1;
            text-align: center;
            padding: 30px;
        }

        .form__imput{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-bottom: 3px solid #fff;
            background: #ea7fee33;
            color: #fff;
        }

        .form__imput:focus{
            background: linear-gradient(to bottom, transparent, #1e9cd688);
            outline: none;
            border-bottom: 3px solid rgb(233, 87, 213);
        }

        .form textarea{
            min-height: 150px;
            resize: none;
        }

        

        .form-img {
            flex: 1;
            padding: 10px;
            display: flex;
            min-width: 300px;
            max-width: 300px;
            order: 1;
        }

        .img-container{
            margin: auto;
            padding: 20px;
            border-radius: 10%;
            background: #fff;
            width: 100%;
        }

        .img{
            width: 100%;
        }

        .form-img img{
            width: 100%;

        }

        .form input[type="submit"]{
            background:  #1e9cd688;
        }

        .form input[type="submit"]:hover{
            background:  #136b9488;
        }
        .form input[type="submit"]:focus{
            background:  #5fc0ec88;
        }
        .form input[type="submit"]:active{
            background: linear-gradient(to bottom, transparent, #1e9cd688);
        }
        

    </style>
</head>
<body>
    <div class="flex-container">
        <form class="form-inscrip">
            <div class="form-inscrip_section">
                <input type="email" class="form__imput" placeholder="Email">
            </div>
            <div class="form_section">
                <input type="text" class="form__imput" placeholder="Asunto">
            </div>
            <div class="form_section">
                <textarea  class="form__imput" placeholder="Mensaje"></textarea>
            </div>
            <div class="form_section">
                <input type="submit" class="form__imput">
            </div>
        </form>
        <div class="form-img">
            <div class="img-container">
                <img src="minion.jpg">
            </div>
        </div>
    </div>


    
</body>
</html>
