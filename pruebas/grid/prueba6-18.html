<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin:0;
        }

        .grid-container{
            display: grid;
            background: #0f0;
            grid-template-rows: 150px 150px 150px ;
            grid-template-columns: 150px 150px 150px ;
            
        }

        .grid-item{
            border: 2px solid #000;
            background-color: rgb(174, 213, 240);
        }
        .grid-item:first-child{
            background-color: #00F;
            grid-column: 1/3;
            grid-row: 1/3;
        }
        


        

    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item">1-GR</div>
        <div class="grid-item">2-GR</div>
        <div class="grid-item">3-GR</div>
        <div class="grid-item">4-GR</div>
        <div class="grid-item">5-GR</div>
        <div class="grid-item">6-GR</div>
        <div class="grid-item">7-GR</div>
        <div class="grid-item">8-GR</div>
        <div class="grid-item">9-GR</div>

    </div>
</body>
</html>
