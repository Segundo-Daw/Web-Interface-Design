<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
        padding: 0;
        margin: 0;
    }

    body{
        background: rgba(255, 255, 255, 0.705);
        padding: 20px;
    }
    .grid-container{
        background-color: rgb(138,138,138);
        margin: 10px;
        display: grid;
        grid-template-areas: 
        "header header header"
        "aside aside main"
        "aside aside main"
        "aside aside main"
        "aside aside main"
        "footer footer footer"
        ;
        grid-template-rows: repeat(auto-fill 1fr);
        height: 95vh;
        border: 5px solid white;

    }


    .grid-header{
        background-color: rgb(174, 142, 248);
        grid-area: header;
    }

    .grid-main{
        background-color: rgb(190, 0, 175);
        grid-area: main;
    }
    .grid-aside{
        background-color: rgb(0, 120, 136);
        grid-area: aside;
    }

    .grid-footer{
        background-color: rgb(30, 0, 70);
        grid-area: footer;

    }

    </style>
</head>

<body>
    <div class="grid-container">
        <div class=" grid-header">1</div>
        <div class="grid-main">2</div>
        <div class="grid-aside">3</div>
        <div class="grid-footer">4</div>

    </div>
</body>
</html>
