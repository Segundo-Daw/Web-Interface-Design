<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin:0;
        }

        body{
            
            padding: 20px;
            background: radial-gradient(circle, rgb(239, 243, 20), rgb(7, 91, 102));        
        }
        
        .grid-container{
            display: grid;
            background: #0f0;
            grid-template-rows: repeat(3,150px);
            grid-template-columns: repeat(3, 150px);
            grid-auto-rows: 300px 100px;
            
        }

        .grid-item{
            border: 2px solid #000;
            background: #0f0;
        }
   
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item">1-GR</div>
        <div class="grid-item">2-GR</div>
        <div class="grid-item">3-GR</div>
        <div class="grid-item">4-GR</div>
        <div class="grid-item">5-GR</div>
        <div class="grid-item">6-GR</div>
        <div class="grid-item">7-GR</div>
        <div class="grid-item">8-GR</div>
        <div class="grid-item">9-GR</div>
        <div class="grid-item">10-GR</div>
        <div class="grid-item">11-GR</div>
        <div class="grid-item">12-GR</div>
    </div>
</body>
</html>
