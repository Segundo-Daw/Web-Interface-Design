<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{margin: 0; padding: 0;}

        .container{
            width: 100%;
        }

        .header{
            background: rgb(171,214,174);
            padding: 10px;
        }

        .main{
            background: rgb(160,230,248);
            padding: 10px;
        }

        .aside{
            background: rgb(255,252,87);
            padding: 10px;
        }

        .footer{
            background: rgb(200,170,240);
            padding: 10px;
        }


        @media (min-width: 768px){

            .container{
                display: flex;
                flex-direction: column;
                height: 100vh;
                background-color: rgb(138,138,138);
            }

            .header{
                height: 80px;
            }

            .footer{
                height: 80px;
            }

            /* Main + Aside en horizontal SIN middle */
            .main-aside{
                flex: 1;              /* ocupa el espacio central */
                display: flex;        /* esta regla es CLAVE */
                flex-direction: row;
            }

            .main{
                flex: 2;              /* como 2 columnas */
            }

            .aside{
                flex: 1;              /* como 1 columna */
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <header class="header">Con Flex</header>

        <div class="main-aside">
            <main class="main">Main</main>
            <aside class="aside">Aside</aside>
        </div>

        <footer class="footer">Footer</footer>

    </div>

</body>
</html>
