<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
            padding: 0;
            margin: 0;
        }

        body{
            background: rgba(255, 255, 255, 0.705);
        }

        /* Layout base */
        .container{
            width: 100%;
        }

        .header{
            background-color: rgb(171, 214, 174);
            padding: 10px;
        }

        .main{
            background-color: rgb(160, 230, 248);
            padding: 10px;
        }

        .aside{
            background-color: rgb(255, 252, 87);
            padding: 10px;
        }

        .footer{
            background-color: rgb(200, 170, 240);
            padding: 10px;
        }

        @media (min-width: 768px) {
            .container{
                background-color: rgb(138,138,138);
                display: grid;

                /* columnas iguales */
                grid-template-columns: 1fr 1fr 1fr;

                /* filas */
                grid-template-rows: 80px 1fr 1fr 1fr 1fr 80px;

                height: 100vh;
            }

            .header{
                grid-column: 1 / span 3;
                grid-row: 1;
            }

            .main{
                grid-column: 1 / span 2;
                grid-row: 2 / span 4;
            }

            .aside{
                grid-column: 3;
                grid-row: 2 / span 4;
            }

            .footer{
                grid-column: 1 / span 3;
                grid-row: 6;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header class="header">Con Grid</header>

        <main class="main">Main</main>

        <aside class="aside">Aside</aside>

        <footer class="footer">Footer</footer>

    </div>
</body>
</html>
