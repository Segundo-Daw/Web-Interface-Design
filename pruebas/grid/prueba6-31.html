<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        body{
            background: radial-gradient(circle, pink, red, orange);
            padding: 20px;
        }
        .grid-container{
            display: grid;
            background: gray;
            grid-template-rows: repeat(3, 200px);
            grid-template-columns: repeat(3, minmax(200px, 150px));
            align-content: flex-end;
            justify-content: flex-end;

            height: 800px;

            align-items: center;
            justify-items: center;

        }

        .grid-item{
            border: 2px solid #000;
            background: rgb(115, 252, 2);
            font-size: 50px;
            padding: 50px;
        }

        .grid-item:first-child{

        }

        .grid-item:nth-child(3){
        }
        .grid-item:nth-child(4){


        }
   
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item">1-GR</div>
        <div class="grid-item">2-GR</div>
        <div class="grid-item">3-GR</div>
        <div class="grid-item">4-GR</div>
        <div class="grid-item">5-GR</div>
        <div class="grid-item">6-GR</div>
        <div class="grid-item">7-GR</div>
        <div class="grid-item">8-GR</div>
        <div class="grid-item">9-GR</div>
      
    </div>
</body>
</html>
