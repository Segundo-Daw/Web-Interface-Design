<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin:0;
        }

        .grid-container{
            display: grid;
            background: #0f0;
            grid-template-rows: 150px 150px 150px 150px 150px;
            grid-template-columns: 150px 150px 150px 150px 150px;
            /*grid-template-columns: 1fr 1fr 1fr;*/
            /*grid-template-columns: 1fr 2fr 1fr;*/
            /*grid-template-columns: 1fr 4fr 2fr;*/
            /*con fr se les proporciona el ancho del tamaño del contenedor, ocupandolo en su totalidad dependiendo de la proporcion que le indiquemos*/
        }

        .grid-item{
            border: 2px solid #000;
        }


        

    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item">1-GR</div>
        <div class="grid-item">2-GR</div>
        <div class="grid-item">3-GR</div>
        <div class="grid-item">4-GR</div>
        <div class="grid-item">5-GR</div>
        <div class="grid-item">6-GR</div>
        <div class="grid-item">7-GR</div>
        <div class="grid-item">8-GR</div>
        <div class="grid-item">9-GR</div>
        <div class="grid-item">10-GR</div>
        <div class="grid-item">11-GR</div>
        <div class="grid-item">12-GR</div>
        <div class="grid-item">13-GR</div>
        <div class="grid-item">14-GR</div>
        <div class="grid-item">15-GR</div>
        <div class="grid-item">16-GR</div>
        <div class="grid-item">17-GR</div>
        <div class="grid-item">18-GR</div>
    </div>
    
</body>
</html>
