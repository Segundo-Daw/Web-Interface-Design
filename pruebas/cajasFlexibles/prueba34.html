<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajas flexibles - FLEX BASIS (importante)</title>
    <style>
        *{
            padding:0;
            margin:0;
        }


        .flex-container{
            display:flex;
            height: 100vh;
            

        }
        
        .flex-item{
            background-color: rgb(175, 16, 190);
            color: #fff;
            min-width: 150px;
            height: 150px;
            width: 400px;
            
        }

        .item-blue{
            background-color: rgb(16, 19, 190);
            order: 3;
        }

        .item-orange{
            background-color: orange;
            order: 6;

        }

    </style>
</head>
<body>
    <div class="flex-container">
        <div class="flex-item item-blue"></div>  
        <div class="flex-item "></div>  
        <div class="flex-item item-orange"></div>  
    </div>
</body>
</html>
