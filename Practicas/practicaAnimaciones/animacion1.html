<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opacidad</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            font-size: 20px;

        }
        .content{
          
            filter: contrast(80);  
            background: white;
        }
        .caja{
            display: inline-block;
            width: 150px;
            height: 105px;
            background: rgb(137,61,235);
            margin: 40px;
            border-radius: 50%;
            filter: blur(15px);
        }
        .caja:first-child{
            animation: pegajoso 2s alternate infinite;
        }

        @keyframes pegajoso {
            0%{
                transform: translate(0);
            }
            100%{
                transform: translate(160px);
            }
     
        }

    </style>
</head>
<body>
    <div class="content">
        <div class="caja"></div>
        <div class="caja"></div>
    </div>
</body>
</html>
