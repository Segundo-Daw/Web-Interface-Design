<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Modal - para abrir y cerrar (3ºevaluación) </title>
    <style>
        body{
            background: rgb(158, 128, 192);
        }
    
    </style>
</head>
<body>
    <div class="container">
        <div class="row mt-3">
            <div class="col">
                <button
                    class="btn btn-primary btn-lg"
                    data-bs-toggle="modal"
                    data-bs-target="#modal-1"
                >
                    Abrir Modal 1
                </button>

                <div
                    class="modal fade"
                    id="modal-1"
                    tabindex="-1"
                    aria-hidden="true"
                    aria-labelledby="label-modal-1"                
                >
                    <!--Cada de diálogo-->
                    <div class="modal-dialog">
                        <!--Contenido de la caja-->
                        <div class="modal-content">
                            <!--Encabejado de la caja-->
                            <div class="modal-header">
                                <h5 class="modal-title">Título del modal</h5>
                                <button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                            </div>

                            <!--cuerpo de la caja-->
                            <div class="modal-body">
                                <h1>hola Mundo</h1>
                                <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Aliquid voluptatibus consectetur tenetur omnis libero </p>
                            </div>

                            <!--Cuerpo de pie de pagina-->
                            <div class="modal-footer">
                                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                                <button type="button" class="btn btn-primary">Acepto</button>

                            </div>
                        </div>

                    </div>

                </div>

            </div>

            <!--Aunque demos en cualquier parte no se cierre y que tenga scroll-->
            <div class="col">
                <button
                    class="btn btn-primary btn-lg"
                    data-bs-toggle="modal"
                    data-bs-target="#modal-2"
                >
                    Abrir Modal 2
                </button>

                <div
                    class="modal fade"
                    id="modal-2"
                    tabindex="-1"
                    aria-hidden="true"
                    aria-labelledby="label-modal-2"
                    data-bs-backdrop="static"                
                >
                    <!--Cada de diálogo-->
                    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                        <!--Contenido de la caja-->
                        <div class="modal-content">
                            <!--Encabejado de la caja-->
                            <div class="modal-header">
                                <h5 class="modal-title">Título del modal</h5>
                                <button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                            </div>

                            <!--cuerpo de la caja-->
                            <div class="modal-body">
                                <h1>hola Mundo</h1>
                                <div style="height: 1000px;">
                                Lorem ipsum dolor, sit amet consectetur adipisicing elit. Aliquid voluptatibus consectetur tenetur omnis libero
                                </div>
                            </div>

                            <!--Cuerpo de pie de pagina-->
                            <div class="modal-footer">
                                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                                <button type="button" class="btn btn-primary">Acepto</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
