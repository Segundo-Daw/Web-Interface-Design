<body>
    <h3>Para poner citas</h3>
    <div class="container">
         <div class="row">
            <hr>
            <div class="col-12">
                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Nesciunt quasi quibusdam molestias eligendi officiis mollitia amet</p>
                <p class="lead">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas eos quam sint similique repellendus tempore vero, doloribus sequi pariatur</p>
            </div>
            <hr>
            <div class="col-12">
                <figure class="text-center">
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus non repudiandae, id voluptatum molestias delectus molestiae mollitia.</p>
                </figure>
            </div>
            <hr>

                <figure class="text-center">
                    <blockquote class="blockquote">
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus non repudiandae, id voluptatum molestias delectus molestiae mollitia. Nihil, iure sit quisquam tempore inventore incidunt, ipsa voluptatibus laboriosam, hic numquam dolor.</p>
                    </blockquote>
                </figure>
            </div>
            <hr>

            <div class="col-12">
                <figcaption class="blockquote-footer">
                    Lorem ipsum  <cite title="the color"> COLOR</cite>sir amoer consectetur
                </figcaption>
            </div>

        </div>
    </div>

</body>
