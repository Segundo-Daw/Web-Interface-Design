<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Popover</title>
    <style>
        body{
            background: rgb(138, 138, 170);
        }
    </style>
</head>
<body>
    <div class="toast-container position-absolute p-3" style="right: 0; top: 0;">
        <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Título</strong>
                <small>Hace un minuto</small>
                <button type="button" class="btn-close" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                Lorem ipsum dolor sit amet.
            </div>
        </div>

        <div class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Título</strong>
                <small>Hace un minuto</small>
                <button type="button" class="btn-close" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                Lorem ipsum dolor sit amet.
            </div>
        </div>

        <div class="toast show bg-primary text-white" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <strong class="toast-body">Lorem ipsum dolor sit amet</strong>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close"></button>
            </div>   
        </div>

    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
