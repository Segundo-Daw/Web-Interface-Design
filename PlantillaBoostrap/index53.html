<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Formularios</title>
    <style>
        body{
            background: rgb(125, 195, 223);
        }
    
    </style>
</head>
<body>
    <div class="container">
        <div class="row mt-3">
            <form action="">
                <select name="pais" id="pais" class="form-select mb-3" aria-label="Selección de país">
                    <option value="francia">Francia</option>
                    <option value="españa">España</option>
                    <option value="portugal">Portugal</option>
                </select>

                <select name="pais" id="pais" class="form-select form-select-lg mb-3" aria-label="Selección de país">
                    <option value="francia">Francia</option>
                    <option value="españa">España</option>
                    <option value="portugal">Portugal</option>
                </select>

                <select name="pais" id="pais" class="form-select form-select-sm mb-3" aria-label="Selección de país">
                    <option value="francia">Francia</option>
                    <option value="españa">España</option>
                    <option value="portugal">Portugal</option>
                </select>

                <!--Si queremos que nuestro select pueda selccionar multiples opciones-->
                <select multiple size="" name="pais" id="pais" class="form-select mb-3" aria-label="Selección de país">
                    <option value="francia">Francia</option>
                    <option value="españa">España</option>
                    <option value="portugal">Portugal</option>
                    <option value="italia">Italia</option>
                    <option value="rusia">Rusia</option>
                </select>

                <!--Si queremos un selec deshabilitado-->
                <select disabled name="pais" id="pais" class="form-select mb-3" aria-label="Selección de país">
                    <option value="francia">Francia</option>
                    <option value="españa">España</option>
                    <option value="portugal">Portugal</option>
          
                </select>

            </form>
		</div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
