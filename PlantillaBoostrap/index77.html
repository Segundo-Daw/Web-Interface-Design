<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Flexboxs en Bootstrap</title>
    <style>
        body{
            background: rgb(182, 222, 238);
        }
        .caja{
            width: 100px;
            height: 100px;
            display: inline-block;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <h2>Enlace toda la tarjeta</h2>
        <div class="row mt-5">
            <div class="col-6">
                <div class="card">
                    <img src="imagenes/bg.jpg" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Titulo de la card</h5>
                        <p class="card-text">Lorem ipsum dolor sit amet.</p>
                        <a href="#" class="btn btn-primary stretched-link">Ver más</a> <!--Con streched-link lo que se hace es que toda la card se convierta en un enlace-->
                    </div>
                </div>
            </div>
        </div>
        <br>

        <h2>Border</h2>
        <div class="row mt-5">
            <div class="col">
                <div class="caja bg-light me-2 border border-primary"></div>
                <div class="caja bg-light me-2 border-top border-primary"></div>
                <div class="caja bg-light me-2 border-end border-primary"></div>
                <div class="caja bg-light me-2 border-bottom border-primary"></div>
                <div class="caja bg-light me-2 border-start border-primary"></div>
            </div>

            <div class="col">
                <div class="caja bg-light me-2 border border-1 border-primary"></div>
                <div class="caja bg-light me-2 border border-2 border-primary"></div>
                <div class="caja bg-light me-2 border border-3 border-primary"></div>
                <div class="caja bg-light me-2 border border-4 border-primary"></div>
                <div class="caja bg-light me-2 border border-5 border-primary"></div>
            </div>

            <div class="col-12 mt-5">
                <div class="caja bg-light me-2 rounded"></div>
                <div class="caja bg-light me-2 rounded-top"></div>
                <div class="caja bg-light me-2 rounded-end"></div>
                <div class="caja bg-light me-2 rounded-bottom"></div>
                <div class="caja bg-light me-2 rounded-start"></div>
                <div class="caja bg-light me-2 rounded-circle"></div>
                <div class="caja bg-light me-2 rounded-pill" style="width: 200px;"></div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
