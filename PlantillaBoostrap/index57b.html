<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Formularios - con Input Group</title>
    <style>
        body{
            background: rgb(29, 119, 4);
        }
    </style>
</head>
<body>
    <div class="container">
        <form action="">
            <div class="row mt-3">
                <div class="col-12 col-md-6">
                    <label for="nombre" class="form-label text-warning">Nombre</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text">@</span>
                        <input type="text" class="form-control" id="nombre" placeholder="Carolina Ruescas">
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <label for="correo" class="form-label text-warning">Correo</label>
                    <div class="input-group mb-3">
                        <span class="input-group-text">@</span>
                        <input type="email" class="form-control" id="correo" placeholder="correo@correo.com">
                    </div>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-12 col-md-6">
                    <label for="mensaje" class="form-label text-warning">Mensaje</label>
                    <div class="input-group">
                        <span class="input-group-text">💬</span>
                        <textarea class="form-control" id="mensaje" placeholder="Escribe tu mensaje"></textarea>
                    </div>
                </div>

                <div class="col-12 col-md-6">
                    <div class="row">
                        <div class="col-6">
                            <label class="form-label text-warning">Estado Civil</label>
                            <div class="form-check">
                                <input type="radio" name="mi-radio-button" class="form-check-input" id="radio-1">
                                <label for="radio-1" class="form-check-label text-warning">Soltero</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" name="mi-radio-button" class="form-check-input" id="radio-2">
                                <label for="radio-2" class="form-check-label text-warning">Casado</label>
                            </div>
                        </div>

                        <div class="col-6">
                            <label for="pais" class="form-label text-warning">País</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text">🌍</span>
                                <select name="pais" id="pais" class="form-select" aria-label="Selección de país">
                                    <option value="portugal">Portugal</option>
                                    <option value="españa">España</option>
                                    <option value="francia">Francia</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12 d-flex justify-content-center">
                    <div class="form-check text-warning">
                        <input type="checkbox" name="checkbox" class="form-check-input" id="checkbox">
                        <label for="checkbox" class="form-check-label">Acepto los términos y condiciones</label>
                    </div> 
                </div>  
                <div class="col-12 d-flex justify-content-center mt-3">
                    <button type="submit" class="btn btn-primary px-5">Enviar comentario</button>  
                </div>      
            </div>
        </form>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
