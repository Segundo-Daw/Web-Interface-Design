<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Formularios (3ºevaluación) </title>
    <style>
        body{
            background: rgb(160, 228, 202);
        }
    
    </style>
</head>
<body>
    <div class="container">
        <div class="row mt-3">
                <div class="col-6">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="email" aria-label="Nombre">
                        <span class="input-group-text">@gmail.com</span>
                    </div>
                    <!-- Para hacer el texarea-->
                    <div class="input-group mb-3">
                        <span class="input-group-text">Notas:</span>
                        <textarea class="form-control" name="" id="label-notas" aria-label="Notas"></textarea>
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text">Nombre</span>
                        <input type="text" class="form-control" aria-label="Nombre">

                        <span class="input-group-text">Apellido</span>
                        <input type="text" class="form-control" aria-label="Apellido">
                    </div>
                </div>

                <div class="col-6">
                    <div class="input-group input-group-sm mb-3">
                        <span class="input-group-text">Pequeño</span>
                        <input type="text" class="form-control" aria-label="Nombre">
                    </div>
                    <div class="input-group input-group-lg mb-3">
                        <span class="input-group-text">Grande</span>
                        <input type="text" class="form-control" aria-label="Nombre">
                    </div>

                    <div class="input-group">
                        <label for="pais" class="input-group-text">País</label>
                        <select name="" id="pais" class="form-select">
                            <option value="italia">Italia</option>
                            <option value="españa">España</option>
                            <option value="francia">Francia</option>
                        </select>
                        <button class="btn btn-primary">Enviar</button>
                    </div>
                </div>
		</div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
