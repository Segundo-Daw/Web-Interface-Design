<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postal Navideña</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .grid-container{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); /*auto-fill para que se vayan bajando autoatiocamente*/
            grid-template-rows: (1fr, 1fr);
            grid-gap: 10px;
            grid-auto-rows: 100px;
            grid-auto-flow: dense;
            max-width: 900px;
            justify-content: center;
            background: #990c0c;
        }

         .grid-item{
            border: 2px solid #000;
            background: #0f0;
        }


        
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item">1-GR</div>
        <div class="grid-item">2-GR</div>
        <div class="grid-item">3-GR</div>
        <div class="grid-item">4-GR</div>
        

    </div>
    
</body>
</html>
