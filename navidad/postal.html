<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postal Navideña</title>
    <style>
         * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        
        background: radial-gradient(circle,
            #ffdde1, #ee9ca7, #d74262, #8a0621, #d74262);
        font-family: "Georgia", serif;

    }

    .postal {
        width: 100%;
        
        max-width: 900px;
        background: white;

    }

    /* ---------- TÍTULO -----------*/
    .texto-central {
        text-align: center;
        font-size: 2.5rem;
        font-weight: bold;
        color: #8a0621;
        margin-bottom: 25px;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    

        
    </style>
</head>
<body>
    <div class="postal">
        <div class="texto-central">
            🎄 ¡Feliz Navidad! 🎁
        </div>
    </div>

   


    
</body>
</html>
