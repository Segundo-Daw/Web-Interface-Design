<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postal Navideña</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: rgb(98, 0, 0);
        }

       .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* 3 columnas */
            grid-auto-rows: 200px; 
            gap: 10px;                             /* espacio entre elementos */
            width: 100vw;
            height: 200px;
            margin: 50px auto;                     /* centra el grid en la página */
            overflow: hidden;
            background: white;
        }

        .grid-container img{
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: balanceo 2s ease-in-out infinite;
            transform-origin: bottom center;
        }

        .arbol-mensaje-contenedor {
            display: flex;
            justify-content: center;      /* centra el conjunto */
            align-items: center;
            gap: 40px;                    /* espacio entre árbol y mensaje */
            margin-top: 60px;
            margin-bottom: 60px;
        }

        /* Imagen grande del árbol */
        .arbol-img {
            height: 700px;
            object-fit: contain;
        }

        /* Caja del mensaje */
        .mensaje-box {
            max-width: 400px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            border: 3px solid #d40000;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .mensaje-box h2 {
            font-size: 32px;
            color: #8b0000;
            margin-bottom: 10px;
        }

        .mensaje-box p {
            font-size: 20px;
            line-height: 1.4;
        }



        @keyframes balanceo {
            0%   { transform: rotate(0deg); }
            25%  { transform: rotate(7deg); }
            50%  { transform: rotate(0deg); }
            75%  { transform: rotate(-7deg); }
            100% { transform: rotate(0deg); }
        }
    
    </style>
</head>
<body>


    <div class="grid-container">
        <img src="papanoel.png" alt="">
        <img src="reno.png" alt="">
        <img src="papanoel.png" alt="">
        <img src="reno.png" alt="">
        <img src="papanoel.png" alt="">
        <img src="reno.png" alt="">
        <img src="papanoel.png" alt="">
        <img src="reno.png" alt="">
    </div>

    <div class="arbol-mensaje-contenedor">
    
        <img src="arbol.png" class="arbol-img" alt="Árbol de Navidad">

        <div class="mensaje-box">
            <h2>¡Feliz Navidad!</h2>
            <p>Que estas fiestas estén llenas de alegría, magia y momentos inolvidables.</p>
        </div>

    </div>



   
</body>
</html>
