<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postal Navideña</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: rgb(98, 0, 0);
        }

       .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* 3 columnas */
            grid-auto-rows: 200px; 
            gap: 10px;                             /* espacio entre elementos */
            width: 100vw;
            height: 200px;
            margin: 50px auto;                     /* centra el grid en la página */
            overflow: hidden;
            background: white;
        }

        .grid-container img{
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: balanceo 2s ease-in-out infinite;
            transform-origin: bottom center;
        }

        .arbol-mensaje-contenedor {
            display: flex;
            justify-content: center;      /* centra el conjunto */
            align-items: center;
            gap: 40px;                    /* espacio entre árbol y mensaje */
            margin-top: 60px;
            margin-bottom: 60px;
        }

        /* Imagen grande del árbol */
        .arbol-img {
            height: 700px;
            object-fit: contain;
        }

        /* Caja del mensaje */
       .mensaje-box {
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            background: linear-gradient(
                120deg,
                #f7d011,
                #596407,
                #9eeab1
            );
            background-size: 300% 300%;
            animation: glowNavidad 10s ease infinite;

            border: 2px solid #c9a14a;
            box-shadow:
                0 15px 30px rgba(0,0,0,0.25),
                inset 0 0 25px rgba(255,215,0,0.25);
        }


        .mensaje-box h2 {
            font-size: 36px;
            text-align: center;
            color: #8b0000;
            margin-bottom: 15px;
            font-family: "Georgia", "Times New Roman", serif;
            letter-spacing: 1px;
        }

        .mensaje-box p {
            font-size: 20px;
            line-height: 1.6;
            text-align: center;
            color: #3a2a2a;
            font-family: "Palatino Linotype", "Book Antiqua", serif;
        }

        /* Ccopitos de nieve*/
        .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white 50%, transparent 50%),
                radial-gradient(3px 3px at 40% 70%, white 50%, transparent 50%),
                radial-gradient(2px 2px at 60% 20%, white 50%, transparent 50%),
                radial-gradient(3px 3px at 80% 60%, white 50%, transparent 50%),
                radial-gradient(2px 2px at 10% 80%, white 50%, transparent 50%);
            background-size: 200px 200px;
            animation: snowFall 5s linear infinite;
        }



        @keyframes balanceo {
            0%   { transform: rotate(0deg); }
            25%  { transform: rotate(7deg); }
            50%  { transform: rotate(0deg); }
            75%  { transform: rotate(-7deg); }
            100% { transform: rotate(0deg); }
        }
        /* ANIMACIÓN DE CAÍDA */
        @keyframes snowFall {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 0 200px;
            }
        }
        @keyframes glowNavidad {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

    
    </style>
</head>
<body>


    <div class="grid-container">
        <img src="papanoel.png" alt="">
        <img src="reno.png" alt="">
        <img src="papanoel.png" alt="">
        <img src="reno.png" alt="">
        <img src="papanoel.png" alt="">
        <img src="reno.png" alt="">
        <img src="papanoel.png" alt="">
        <img src="reno.png" alt="">
    </div>

    <div class="arbol-mensaje-contenedor">
    
        <img src="arbol.png" class="arbol-img" alt="Árbol de Navidad">

        <div class="mensaje-box">
            <h2>¡Feliz Navidad!</h2>
            <p>Que estas fiestas estén llenas de alegría, magia y momentos inolvidables.</p>
        </div>

    </div>



   <div class="snow"></div>

</body>
</html>
